<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TessDesk</title>
<meta name="description" content="TessDesk: Tesla charging cost dashboard. Design by Van.">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TessDesk">
<meta name="format-detection" content="telephone=no">
<link rel="preload" href="fonts/BebasNeue-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="style.css">
<script>window.TD_CONFIG = { variant: 'main', storagePrefix: 'td:' };
try { var on = true, cc = JSON.parse(localStorage.getItem('td:cache') || 'null'),
  chg = !!(cc && cc.state && cc.state.charge_state && cc.state.charge_state.charging_state === 'Charging');
  if (on) { document.documentElement.className = chg ? 'pre-tessie' : 'pre-tessie-idle';
    document.querySelector('meta[name=theme-color]').setAttribute('content', chg ? '#081426' : '#170a0d'); } } catch (e) {}</script>
</head>
<body>
<script>var pc = document.documentElement.className; if (pc === 'pre-tessie') document.body.className = 'tessie'; else if (pc === 'pre-tessie-idle') document.body.className = 'tessie idle';</script>
<div id="app"></div>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {}); });
}
</script>
</body>
</html>
