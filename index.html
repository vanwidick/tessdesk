<head>

<script>window.TD_CONFIG = { variant: 'main', storagePrefix: 'td:' };
try { if (JSON.parse(localStorage.getItem('td:tessieLook'))) document.documentElement.className = 'pre-tessie'; } catch (e) {}</script>
</head>
<body>
<script>if (document.documentElement.className === 'pre-tessie') document.body.className = 'tessie';</script>
<div id="app"></div>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {}); });
}
</script>
</body>
